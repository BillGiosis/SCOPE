# CLAD-C Benchmark Configuration
benchmark:
  name: "CLAD-C"
  data_root: "/workspace/data/CLAD-C"  # Path to CLAD-C dataset
  clad_repo_root: "/workspace/CLAD" # Change this to your CLAD repository root
  num_tasks: 6  # Official CLAD-C has 6 temporal tasks
  num_classes_per_task: 7  # CLAD-C has 7 classes total
  total_classes: 7  # first one is unused

  # CLAD-C challenge rule used by the network expansion parameter budget
  max_params_ratio: 1.05  # 105% of initial model params

training:
  batch_size: 10  # 10 as per CLAD-C challenge
  epochs_per_task: 70
  learning_rate: 0.0001
  optimizer: "adamw"
  weight_decay: 0.01
  eval_frequency: 70  # Evaluate every N epochs
  use_amp: true  # Enable automatic mixed precision on CUDA

  # Gradient accumulation
  use_gradient_accumulation: true  # Enable gradient accumulation
  accumulation_steps: 4  # Effective batch size = batch_size * accumulation_steps

  # Class-Balanced Loss
  cb_beta: 0.99  # Class-balanced loss beta

replay_buffer:
  enabled: true  # Enable/disable replay buffer
  initial_size: 900  # Start near max for better rare class coverage
  max_size: 1000  # CLAD-C challenge limit
  samples_per_class: 200
  distillation_temp: 1.5
  replay_batch_size: 32
  auto_distill_end_of_task: true  # Distill automatically at each task boundary
  end_of_task_distill_compression_ratio: 0.96  # Keep top 96% by entropy importance

data_loading:
  num_workers: 8  # Parallel data loading
  pin_memory: true  # Use pinned memory for faster GPU transfers
  prefetch_factor: 4  # Prefetch batches

network_expansion:
  enabled: true
  strategy: "all_layers"  # Options: "all_layers" or "layer2_layer3_split"
  # all_layers: budget-aware, evenly distributed across layer1-4 each task start
  # strategy: "layer2_layer3_split"  # Expands both layer2 and layer3 each task (50/50)

network_pruning:
  enabled: true
  amount: 0.01  # Maximum fraction pruned at task end (applied by scope)
  warmup_tasks: 2  # Do not prune during first N tasks to protect early AMCA
  interval_tasks: 1  # Run pruning every N tasks after warmup
  budget_driven: true  # Prune only as needed to reopen next-task expansion budget
  min_amount: 0.0
  max_amount: 0.01
  scope: "whole_model"  # Options: "whole_model", "older_adapters_only", or "all_adapters"
  method: "structural"  # Options: "structural" (torch-pruning) or "unstructured"
  importance: "taylor"  # Options: "magnitude" or "taylor"
  use_replay_for_taylor: true
  taylor_replay_batches: 3
  taylor_train_batches: 0  # Keep Taylor scoring replay-driven by default
  taylor_replay_batch_size: 32
  rebuild_optimizer_after_prune: true
  recompile_after_prune: true
  example_input_shape: [1, 3, 224, 224]
  protect_current_task_adapters: true
  protect_classifier: true
  protect_downsample: true
  rollback:
    enabled: true
    max_mca_drop: 0.01
    eval_max_batches: 20
  recovery:
    enabled: true
    epochs: 5
    learning_rate_scale: 0.18
  validation:
    report_efficiency_metrics: true
    latency_warmup_runs: 5
    latency_runs: 20

logging:
  save_dir: "./checkpoints/cladc"
